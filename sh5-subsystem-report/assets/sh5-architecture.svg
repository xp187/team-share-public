<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
  <defs>
    <marker id="ar-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ar-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="ar-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="ar-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="ar-gr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="30" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">SH5（SH5_STBY）待机子系统 —— 三电源域架构（AOSHAN）</text>
  <rect x="36" y="56" width="210" height="470" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="50" y="80" font-size="15" font-weight="600" fill="#111827">AON 域</text>
  <text x="50" y="97" font-size="11" fill="#6b7280">常开电 · 永不掉电</text>
  <rect x="56" y="108" width="170" height="44" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="141.0" y="126.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Bandgap + OSC</text>
  <text x="141.0" y="143.0" font-size="11" fill="#6b7280" text-anchor="middle">27 MHz 晶振</text>
  <rect x="56" y="166" width="170" height="52" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="141.0" y="188.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">PMU 状态机</text>
  <text x="141.0" y="205.0" font-size="11" fill="#6b7280" text-anchor="middle">27MHz · 与APB异步</text>
  <rect x="56" y="238" width="170" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="141.0" y="256.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Power Key</text>
  <text x="141.0" y="273.0" font-size="11" fill="#6b7280" text-anchor="middle">整机电源键输入</text>
  <rect x="56" y="302" width="170" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="141.0" y="318.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">PMU 寄存器</text>
  <text x="141.0" y="335.0" font-size="11" fill="#6b7280" text-anchor="middle">APB 27/166MHz</text>
  <rect x="56" y="364" width="170" height="62" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="141.0" y="391.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">电源/复位生成</text>
  <text x="141.0" y="408.0" font-size="11" fill="#6b7280" text-anchor="middle">stb_pwr_on / power_on</text>
  <rect x="56" y="450" width="170" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="141.0" y="474.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Boot Status 寄存器</text>
  <text x="141.0" y="491.0" font-size="11" fill="#6b7280" text-anchor="middle">看门狗/SW/LVR 启动原因</text>
  <rect x="262" y="56" width="420" height="470" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="276" y="80" font-size="15" font-weight="600" fill="#111827">STBY 域 —— SH5_STBY</text>
  <text x="276" y="97" font-size="11" fill="#6b7280">常开电 · OFF 态无 OSC CLK</text>
  <rect x="372" y="108" width="200" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="472.0" y="137.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">LEON3 CPU</text>
  <text x="472.0" y="154.0" font-size="11" fill="#6b7280" text-anchor="middle">SPARC V8 · 27/600MHz</text>
  <text x="472" y="166" font-size="10.5" fill="#6b7280" text-anchor="middle">I/D-Cache 4KB · DSU · 8 寄存器窗口</text>
  <rect x="322" y="190" width="320" height="30" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="482.0" y="209.0" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">AHB / APB 总线架构（含 int_misc 中断汇聚）</text>
  <rect x="302" y="240" width="108" height="46" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="356.0" y="259.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">GPIO ×34</text>
  <text x="356.0" y="276.0" font-size="11" fill="#6b7280" text-anchor="middle">输入/输出/中断</text>
  <rect x="422" y="240" width="108" height="46" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="476.0" y="259.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">SAR-ADC ×4</text>
  <text x="476.0" y="276.0" font-size="11" fill="#6b7280" text-anchor="middle">按键电压检测</text>
  <rect x="542" y="240" width="108" height="46" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="596.0" y="259.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">PWM</text>
  <text x="596.0" y="276.0" font-size="11" fill="#6b7280" text-anchor="middle">呼吸灯</text>
  <rect x="302" y="296" width="108" height="46" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
