  <text x="242" y="180" font-size="10.5" fill="#ea580c" text-anchor="middle">CLK/RST</text>
  <line x1="141" y1="238" x2="141" y2="222" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ar-o)"/>
  <text x="120" y="232" font-size="11" fill="#ea580c" text-anchor="middle">脉冲</text>
  <path d="M 226 396 C 244 380, 250 340, 268 320" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ar-o)"/>
  <line x1="572" y1="141" x2="740" y2="141" stroke="#ea580c" stroke-width="2" marker-end="url(#ar-o)"/>
  <text x="656" y="129" font-size="11" fill="#ea580c" text-anchor="middle">power_on / iso / rst_n</text>
  <path d="M 640 434 C 690 440, 700 448, 740 452" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ar-o)"/>
  <path d="M 821 282 C 830 230, 700 160, 578 148" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ar-gr)"/>
  <text x="712" y="206" font-size="11" fill="#6b7280" text-anchor="middle">mcu_clk / apb_clk（Active 时切高速）</text>
  <rect x="302" y="566" width="140" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="372.0" y="588.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">外部 EEPROM</text>
  <text x="372.0" y="605.0" font-size="11" fill="#6b7280" text-anchor="middle">保存待机/OFF 状态</text>
  <rect x="492" y="566" width="200" height="52" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="592.0" y="588.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">整机主机 / 调试主机</text>
  <text x="592.0" y="605.0" font-size="11" fill="#6b7280" text-anchor="middle">DDC · DBGI2C · DBGSPI</text>
  <line x1="356" y1="566" x2="356" y2="402" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="330" y="480" font-size="11" fill="#16a34a" text-anchor="middle">E2P 读写</text>
  <line x1="592" y1="566" x2="592" y2="402" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ar-p)"/>
  <text x="592" y="480" font-size="11" fill="#9333ea" text-anchor="middle">烧录 / 调试（密码握手）</text>
  <g>
  <line x1="46" y1="580" x2="78" y2="580" stroke="#ea580c" stroke-width="2" marker-end="url(#ar-o)"/>
  <text x="84" y="584" font-size="11" fill="#6b7280">电源/时钟/复位控制</text>
  <line x1="46" y1="602" x2="78" y2="602" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar-b)"/>
  <text x="84" y="606" font-size="11" fill="#6b7280">唤醒中断</text>
  <line x1="46" y1="624" x2="78" y2="624" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="84" y="628" font-size="11" fill="#6b7280">数据（E2P）</text>
  <line x1="190" y1="580" x2="222" y2="580" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar-p)"/>
  <text x="228" y="584" font-size="11" fill="#6b7280">调试/烧录通道</text>
  <line x1="190" y1="602" x2="222" y2="602" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar-gr)"/>
  <text x="228" y="606" font-size="11" fill="#6b7280">时钟切换路径</text>
