  <text x="476.0" y="315.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">CEC ×2 / AUX ×2</text>
  <text x="476.0" y="332.0" font-size="11" fill="#6b7280" text-anchor="middle">指令唤醒</text>
  <rect x="542" y="296" width="108" height="46" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="596.0" y="315.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Type-C ×2</text>
  <text x="596.0" y="332.0" font-size="11" fill="#6b7280" text-anchor="middle">插入唤醒</text>
  <rect x="302" y="352" width="108" height="46" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="356.0" y="371.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">DDC ×3 (EDDC)</text>
  <text x="356.0" y="388.0" font-size="11" fill="#6b7280" text-anchor="middle">VGA×1 HDMI×2</text>
  <rect x="422" y="352" width="108" height="46" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="476.0" y="371.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">MI2C</text>
  <text x="476.0" y="388.0" font-size="11" fill="#6b7280" text-anchor="middle">master I2C</text>
  <rect x="542" y="352" width="108" height="46" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="596.0" y="371.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">DBGI2C / DBGSPI</text>
  <text x="596.0" y="388.0" font-size="11" fill="#6b7280" text-anchor="middle">调试桥</text>
