  <rect x="744" y="224" width="154" height="44" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="821.0" y="250.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">DDR 控制</text>
  <rect x="744" y="282" width="154" height="44" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
