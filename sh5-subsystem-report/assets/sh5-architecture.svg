  <text x="821.0" y="384.0" font-size="11" fill="#6b7280" text-anchor="middle">I2C0/I2C1 · UART …</text>
  <rect x="744" y="424" width="154" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
