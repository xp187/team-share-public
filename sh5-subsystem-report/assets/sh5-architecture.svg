  <text x="410.0" y="447.0" font-size="11" fill="#6b7280" text-anchor="middle">iso · rst_n · power_on 输出</text>
  <rect x="532" y="414" width="108" height="40" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="586.0" y="430.0" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Standby reg</text>
  <text x="586.0" y="447.0" font-size="11" fill="#6b7280" text-anchor="middle">寄存器堆</text>
  <path d="M 416 348 L 416 226" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ar-b)"/>
  <text x="330" y="232" font-size="11" fill="#2563eb">唤醒中断（Cable/CEC/AUX/ADC/DDC…）</text>
