<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
  <defs>
    <marker id="ar-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ar-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="ar-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="ar-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="ar-gr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="30" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">SH5 的 I2C 家族 —— 五个模块的角色与数据通路</text>
  <rect x="30" y="56" width="210" height="540" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="44" y="80" font-size="15" font-weight="600" fill="#111827">芯片外部</text>
  <rect x="56" y="104" width="158" height="58" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="135.0" y="129.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">整机主机 / PC</text>
  <text x="135.0" y="146.0" font-size="11" fill="#6b7280" text-anchor="middle">经 HDMI / VGA 线材 DDC</text>
  <rect x="56" y="192" width="158" height="52" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="135.0" y="214.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">调试主机</text>
  <text x="135.0" y="231.0" font-size="11" fill="#6b7280" text-anchor="middle">DBGI2C 引脚（AON_GP0/1）</text>
  <rect x="56" y="272" width="158" height="52" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="135.0" y="294.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">SPI 主机</text>
  <text x="135.0" y="311.0" font-size="11" fill="#6b7280" text-anchor="middle">DBGSPI 引脚</text>
  <rect x="56" y="352" width="158" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="135.0" y="374.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">外部 EEPROM</text>
  <text x="135.0" y="391.0" font-size="11" fill="#6b7280" text-anchor="middle">待机/状态数据</text>
  <rect x="280" y="56" width="400" height="540" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="294" y="80" font-size="15" font-weight="600" fill="#111827">SH5（STBY 域）</text>
  <rect x="310" y="104" width="160" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="390.0" y="126.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">DDC / EDDC 从机</text>
  <text x="390.0" y="143.0" font-size="11" fill="#6b7280" text-anchor="middle">VGA×1 · HDMI×2</text>
  <rect x="500" y="104" width="150" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="575.0" y="126.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">DDC access 开关</text>
  <text x="575.0" y="143.0" font-size="11" fill="#6b7280" text-anchor="middle">0xFC 密码握手</text>
  <rect x="310" y="196" width="160" height="66" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="390.0" y="225.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">DBGI2C 桥</text>
  <text x="390.0" y="242.0" font-size="11" fill="#6b7280" text-anchor="middle">PWD 0x33 → SLV 0x34</text>
  <text x="390" y="252" font-size="10.5" fill="#6b7280" text-anchor="middle">外部 I2C → AHB / APB</text>
  <rect x="500" y="196" width="150" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="575.0" y="218.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">DBGSPI 桥</text>
  <text x="575.0" y="235.0" font-size="11" fill="#6b7280" text-anchor="middle">SPI → AHB</text>
  <rect x="310" y="300" width="160" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="390.0" y="322.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">MI2C（master）</text>
  <text x="390.0" y="339.0" font-size="11" fill="#6b7280" text-anchor="middle">LEON 控制</text>
  <rect x="310" y="390" width="340" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="480.0" y="413.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">LEON3（待机固件）</text>
  <text x="480.0" y="430.0" font-size="11" fill="#6b7280" text-anchor="middle">中断响应 · 电源切换 · E2P 状态管理</text>
  <rect x="310" y="478" width="340" height="80" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="480.0" y="522.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle"></text>
  <text x="480" y="501" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">系统控制寄存器</text>
  <text x="480" y="523" font-size="11" fill="#6b7280" text-anchor="middle">0x80 控制字（WatchDog / CPU_RST_N / BUS_RST_N）</text>
  <text x="480" y="540" font-size="11" fill="#6b7280" text-anchor="middle">+ 0x88/0x89 = 0xCBDC 秘钥；Device 0x32（DDC 通路 0x64）</text>
  <rect x="720" y="56" width="210" height="300" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="734" y="80" font-size="15" font-weight="600" fill="#111827">内部总线（STBY 域）</text>
  <rect x="746" y="104" width="158" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="825.0" y="126.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">STBY AHB</text>
  <text x="825.0" y="143.0" font-size="11" fill="#6b7280" text-anchor="middle">全局地址空间</text>
  <rect x="746" y="182" width="158" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="825.0" y="204.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">HOST_APB_STBY</text>
  <text x="825.0" y="221.0" font-size="11" fill="#6b7280" text-anchor="middle">PAGE 0x110b_0000~ffff</text>
  <rect x="720" y="376" width="210" height="220" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="734" y="400" font-size="15" font-weight="600" fill="#111827">MAIN 域</text>
  <rect x="746" y="424" width="158" height="62" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="825.0" y="451.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">I2C0 / I2C1</text>
  <text x="825.0" y="468.0" font-size="11" fill="#6b7280" text-anchor="middle">DW_apb_i2c 控制器</text>
  <text x="825" y="502" font-size="10.5" fill="#6b7280" text-anchor="middle">0x110A_3000 / 0x110A_4000</text>
  <text x="825" y="518" font-size="10.5" fill="#6b7280" text-anchor="middle">APB_MAIN · SS/FS 模式</text>
  <rect x="746" y="532" width="158" height="44" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="825.0" y="550.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">通用 I2C 外设</text>
  <text x="825.0" y="567.0" font-size="11" fill="#6b7280" text-anchor="middle">传感器/EEPROM 等</text>
  <line x1="214" y1="133" x2="306" y2="130" stroke="#9333ea" stroke-width="2" marker-end="url(#ar-p)"/>
  <text x="258" y="118" font-size="11" fill="#9333ea" text-anchor="middle">DDC(I2C)</text>
  <line x1="470" y1="130" x2="496" y2="130" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar-b)"/>
  <path d="M 575 156 C 575 176, 540 188, 474 198" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ar-b)"/>
  <text x="522" y="180" font-size="10.5" fill="#2563eb" text-anchor="middle">密码 0x31393639 导通</text>
  <line x1="214" y1="218" x2="306" y2="224" stroke="#9333ea" stroke-width="2" marker-end="url(#ar-p)"/>
  <path d="M 214 298 C 330 290, 420 260, 496 232" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#ar-p)"/>
  <path d="M 470 214 C 570 200, 660 160, 742 136" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ar-b)"/>
  <text x="618" y="164" font-size="11" fill="#2563eb" text-anchor="middle">AHB 读写</text>
  <path d="M 470 240 C 570 236, 660 222, 742 212" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ar-b)"/>
  <text x="640" y="256" font-size="11" fill="#2563eb" text-anchor="middle">APB 读写</text>
  <path d="M 650 222 C 700 210, 712 170, 742 140" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ar-b)"/>
  <path d="M 352 262 C 340 330, 380 440, 448 474" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ar-o)"/>
  <line x1="214" y1="378" x2="306" y2="322" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="246" y="340" font-size="11" fill="#16a34a" text-anchor="middle">读写</text>
  <line x1="390" y1="390" x2="390" y2="356" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar-o)"/>
  <path d="M 600 390 C 560 336, 505 296, 432 264" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ar-o)"/>
  <text x="530" y="330" font-size="10.5" fill="#ea580c" text-anchor="middle">固件控制/中断</text>
  <line x1="825" y1="532" x2="825" y2="490" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar-gr)"/>
  <text x="480" y="626" font-size="11" fill="#6b7280" text-anchor="middle">注：I2C0/I2C1 位于 MAIN 域，由主系统使用；其余四个模块在 STBY 域（SH5）。</text>
  <line x1="300" y1="596" x2="332" y2="596" stroke="#9333ea" stroke-width="2" marker-end="url(#ar-p)"/>
  <text x="338" y="600" font-size="11" fill="#6b7280">外部 I2C/SPI 激励</text>
  <line x1="452" y1="596" x2="484" y2="596" stroke="#2563eb" stroke-width="2" marker-end="url(#ar-b)"/>
  <text x="490" y="600" font-size="11" fill="#6b7280">内部总线访问</text>
  <line x1="592" y1="596" x2="624" y2="596" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="630" y="600" font-size="11" fill="#6b7280">E2P 数据</text>
</svg>