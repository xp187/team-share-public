<text x="60" y="516" font-size="12" fill="#6b7280" text-anchor="start">每个字节都从 bit0（LSB）开始发送</text>
<text x="420" y="442" font-size="12" fill="#111827" text-anchor="start" font-weight="600">多字节字段：低字节先发（LS byte first）</text>
<text x="420" y="466" font-size="12" fill="#111827" text-anchor="start" class="mono">WC=0x0001 →</text>
