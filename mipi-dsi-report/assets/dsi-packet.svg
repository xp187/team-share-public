<text x="600" y="568" font-size="12" fill="#4b5563" text-anchor="middle">示例解析：DI=0x29，WC=0x0001（payload 1 字节），ECC=0x06，Data=0x01，CRC=0x1E0E → 线上字节序 29 01 00 06 01 0E 1E</text>
<rect x="60" y="588" width="16" height="16" rx="3" ry="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
<text x="84" y="601" font-size="12" fill="#6b7280" text-anchor="start">PH：32-bit Packet Header</text>
<rect x="330" y="588" width="16" height="16" rx="3" ry="3" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="354" y="601" font-size="12" fill="#6b7280" text-anchor="start">Payload：WC 字节数据</text>
<rect x="570" y="588" width="16" height="16" rx="3" ry="3" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5"/>
<text x="594" y="601" font-size="12" fill="#6b7280" text-anchor="start">PF：16-bit Checksum（CRC-16）</text>
<rect x="880" y="588" width="16" height="16" rx="3" ry="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="904" y="601" font-size="12" fill="#6b7280" text-anchor="start">DI 高 2 位 = VC（虚拟通道）</text>
<text x="60" y="632" font-size="12" fill="#6b7280" text-anchor="start">发送顺序规则：每个字节 LSB（bit0）先发；多字节字段（WC、Checksum）低字节先发；接收端按 WC 计数定界，无额外同步码。</text>
<text x="60" y="664" font-size="12" fill="#6b7280" text-anchor="start">级联规则：一次 HS / LP transmission 可携带多个 packet；HS 模式下 packet 间若有空隙须拆分为独立 transmission（各带 SoT / EoT）。</text>
