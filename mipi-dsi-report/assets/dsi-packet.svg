<rect x="168" y="452" width="36" height="28" rx="3" ry="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="186" y="471" font-size="12" fill="#111827" text-anchor="middle" class="mono">b3</text>
<rect x="204" y="452" width="36" height="28" rx="3" ry="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="222" y="471" font-size="12" fill="#111827" text-anchor="middle" class="mono">b4</text>
