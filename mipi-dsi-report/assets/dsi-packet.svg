<text x="556" y="346" font-size="12" fill="#111827" text-anchor="start">用途：大多数 Command Mode 命令与 H / V Sync 事件（VSS / VSE / HSS / HSE）</text>
<text x="556" y="368" font-size="12" fill="#111827" text-anchor="start">单参数命令：参数放 Data 0，Data 1 置 0x00；无 Packet Footer</text>
<text x="60" y="418" font-size="14" fill="#111827" text-anchor="start" font-weight="600">③ 字节序与线上发送顺序</text>
<text x="60" y="442" font-size="12" fill="#111827" text-anchor="start" font-weight="600">单字节内：LSB first（bit0 先发）</text>
