<text x="230" y="244" font-size="12" fill="#6b7280" text-anchor="middle">DT[5:0] 数据类型</text>
<text x="230" y="262" font-size="12" fill="#6b7280" text-anchor="middle">例：DT=0x29 → Generic Long Write</text>
<rect x="560" y="186" width="580" height="104" rx="8" ry="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="576" y="210" font-size="12" fill="#111827" text-anchor="start">ECC：保护整个 4 字节 PH，纠 1 bit、检 2 bit（P7=P6=0）</text>
<text x="576" y="232" font-size="12" fill="#111827" text-anchor="start">WC：Payload 字节数；无 start / end 同步码，靠 WC 计数定界</text>
<text x="576" y="254" font-size="12" fill="#111827" text-anchor="start">Checksum：host 必须计算发送；peripheral 可选（不支持发 0x0000）</text>
<text x="576" y="276" font-size="12" fill="#111827" text-anchor="start">payload 长度为 0 时 Checksum = 0xFFFF</text>
<text x="60" y="312" font-size="14" fill="#111827" text-anchor="start" font-weight="600">② Short Packet（固定 4 字节，仅 PH 无 PF）</text>
