<text x="40" y="548" font-size="12" fill="#6b7280" text-anchor="start">注：所有 LP 状态持续 ≥ TLPX（min 50ns）；LP 时钟 = Dp ⊕ Dn（异或重建）；HS 传输期间 LP 接收器始终把差分态视为 LP-00。</text>
<text x="40" y="570" font-size="12" fill="#6b7280" text-anchor="start">* Escape Mode 中出现 LP-11 即返回 Control Stop；Stop（LP-11）居中心地位：线上出现 Stop 达最小要求时间，状态机无条件回到 Stop。</text>
