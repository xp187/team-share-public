<text x="617" y="330" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">0</text>
<text x="717" y="330" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">0</text>
<text x="817" y="330" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">1</text>
<text x="945" y="372" font-size="12" fill="#6b7280" text-anchor="start">随后按命令进入</text>
<text x="945" y="392" font-size="12" fill="#6b7280" text-anchor="start">对应模式（Mark-1 + Stop 结束）</text>
<path d="M90,524 V530 H190 V524" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<text x="140" y="546" font-size="12" fill="#374151" text-anchor="middle" font-family="Consolas,monospace">bit 1 = Mark-1 + Space</text>
