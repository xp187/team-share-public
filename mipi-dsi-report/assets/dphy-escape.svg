<path d="M90,476 L145,476 L145,506 L190,506 L190,476 L245,476 L245,506 L290,506 L290,476 L345,476 L345,506 L390,506 L390,476 L445,476 L445,506 L490,506 L490,476 L545,476 L545,506 L590,506 L590,476 L645,476 L645,506 L690,506 L690,476 L745,476 L745,506 L790,506 L790,476 L845,476 L845,506 L890,506" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/>
