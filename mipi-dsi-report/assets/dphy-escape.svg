<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
<style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;}</style>
<rect width="1200" height="680" fill="#ffffff"/>
<text x="600" y="32" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold">Escape Mode：进入序列、Spaced-One-Hot 编码与 Entry Command</text>
<text x="600" y="54" font-size="12" fill="#6b7280" text-anchor="middle">进入序列 LP-11 → LP-10 → LP-00 → LP-01 → LP-00；Mark 后必跟 Space；Escape 不依赖 Clock Lane，时钟 = Dp ⊕ Dn</text>
<text x="60" y="86" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">① 进入序列（Control → Escape）</text>
<path d="M90,110 L270,110 L270,150 L540,150" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
<path d="M90,180 L180,180 L180,220 L360,220 L360,180 L450,180 L450,220 L540,220" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
<path d="M540,150 L590,150" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4,3"/>
<path d="M540,220 L590,220" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4,3"/>
<text x="44" y="132" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">Dp</text>
<text x="44" y="202" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">Dn</text>
<text x="600" y="140" font-size="12" fill="#7c3aed" text-anchor="start">→ Escape Mode（Space 态）</text>
<text x="600" y="160" font-size="12" fill="#7c3aed" text-anchor="start">随后必须发 8-bit entry command</text>
<text x="135" y="244" font-size="12" fill="#111827" text-anchor="middle" font-family="Consolas,monospace">LP-11</text>
<text x="225" y="244" font-size="12" fill="#111827" text-anchor="middle" font-family="Consolas,monospace">LP-10</text>
<text x="315" y="244" font-size="12" fill="#111827" text-anchor="middle" font-family="Consolas,monospace">LP-00</text>
<text x="405" y="244" font-size="12" fill="#111827" text-anchor="middle" font-family="Consolas,monospace">LP-01</text>
<text x="495" y="244" font-size="12" fill="#111827" text-anchor="middle" font-family="Consolas,monospace">LP-00</text>
<text x="135" y="262" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">Stop</text>
<text x="225" y="262" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">LP-Rqst</text>
<text x="495" y="262" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">Space</text>
<path d="M90,266 V272 H540 V266" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<text x="315" y="288" font-size="12" fill="#374151" text-anchor="middle" font-family="Consolas,monospace">每个 LP 相位 ≥ TLPX（min 50ns）</text>
<rect x="860" y="80" width="300" height="190" rx="8" ry="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="875" y="102" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="bold">Spaced-One-Hot 编码</text>
<text x="875" y="126" font-size="12" fill="#374151" text-anchor="start" font-family="Consolas,monospace">Mark-1 = LP-10 → bit 1</text>
<text x="875" y="150" font-size="12" fill="#374151" text-anchor="start" font-family="Consolas,monospace">Mark-0 = LP-01 → bit 0</text>
<text x="875" y="174" font-size="12" fill="#374151" text-anchor="start">Space = LP-00（每个 Mark 后必跟）</text>
<text x="875" y="198" font-size="12" fill="#374151" text-anchor="start">退出前最后相位 = 不带 Space 的 Mark-1</text>
<text x="875" y="222" font-size="12" fill="#374151" text-anchor="start">时钟 = Dp ⊕ Dn（自定时）</text>
<text x="875" y="246" font-size="12" fill="#374151" text-anchor="start">Stop（LP-11）出现即退出 Escape</text>
<text x="60" y="312" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">② 示例：发送 entry command 0x87（LPDT），位模式 11100001（发送顺序，先发位 = LSB）</text>
<path d="M90,336 L145,336 L145,376 L190,376 L190,336 L245,336 L245,376 L290,376 L290,336 L345,336 L345,376 L390,376 L390,376 L445,376 L445,376 L490,376 L490,376 L545,376 L545,376 L590,376 L590,376 L645,376 L645,376 L690,376 L690,376 L745,376 L745,376 L790,376 L790,336 L845,336 L845,376 L890,376" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
