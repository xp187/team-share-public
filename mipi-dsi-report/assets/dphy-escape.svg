<text x="44" y="428" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">Dn</text>
<text x="44" y="498" font-size="12" fill="#7c3aed" text-anchor="middle" font-family="Consolas,monospace">Dp⊕Dn</text>
<text x="117" y="330" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">1</text>
<text x="217" y="330" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">1</text>
