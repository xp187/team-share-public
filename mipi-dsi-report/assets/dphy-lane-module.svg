<text x="40" y="614" font-size="12" fill="#6b7280" text-anchor="start">注：含 HS-TX 必含 LP-TX，含 HS-RX 必含 LP-RX；LP-CD 仅双向 Lane 需要；反向 HS 带宽 = 正向 1/4。</text>
