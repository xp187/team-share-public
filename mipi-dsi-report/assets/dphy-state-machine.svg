<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
<style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;}</style>
<defs>
<marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
<marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
<marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
<marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
<marker id="a-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker>
</defs>
<rect width="960" height="700" fill="#ffffff"/>
<text x="480" y="34" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold">D-PHY Lane 状态机：从 Stop 出发的三种请求序列</text>
<text x="480" y="56" font-size="12" fill="#6b7280" text-anchor="middle">Control Mode 下的 LP 状态序列；所有 LP 相位 ≥ TLPX；虚线 = 返回 Stop</text>
<rect x="320" y="80" width="160" height="64" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="400" y="104" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">HS Burst</text>
<text x="400" y="124" font-size="12" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,monospace">SoT → Data → EoT</text>
<rect x="340" y="190" width="120" height="48" rx="8" ry="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="400" y="209" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">LP-00</text>
<text x="400" y="227" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">Bridge</text>
<rect x="340" y="280" width="120" height="48" rx="8" ry="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="400" y="299" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">LP-01</text>
<text x="400" y="317" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">HS-Rqst</text>
<path d="M400,400 L400,332" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
<path d="M400,280 L400,242" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
<path d="M400,190 L400,148" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
<path d="M480,112 L545,112 L545,410 L481,410" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-blue)"/>
<text x="552" y="255" font-size="12" fill="#1d4ed8" text-anchor="start">EoT：驱动 LP-11 持续 THS-EXIT</text>
<rect x="515" y="414" width="72" height="48" rx="8" ry="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="551" y="433" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">LP-10</text>
<text x="551" y="451" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">LP-Rqst</text>
<rect x="597" y="414" width="72" height="48" rx="8" ry="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="633" y="433" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">LP-00</text>
<text x="633" y="451" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">Bridge</text>
<rect x="679" y="414" width="72" height="48" rx="8" ry="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="715" y="433" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">LP-01</text>
<text x="715" y="451" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">Mark-0</text>
<rect x="761" y="414" width="72" height="48" rx="8" ry="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="797" y="433" font-size="12" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">LP-00</text>
<text x="797" y="451" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">Space</text>
<path d="M475,438 L511,438" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
<path d="M587,438 L593,438" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
<path d="M669,438 L675,438" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
<path d="M751,438 L757,438" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
<path d="M833,438 L841,438" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
<rect x="845" y="368" width="105" height="140" rx="8" ry="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="897" y="386" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">Escape Mode</text>
<rect x="853" y="396" width="89" height="30" rx="4" ry="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="897" y="415" font-size="12" fill="#7c3aed" text-anchor="middle" font-family="Consolas,monospace">LPDT</text>
<rect x="853" y="434" width="89" height="30" rx="4" ry="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="897" y="453" font-size="12" fill="#7c3aed" text-anchor="middle" font-family="Consolas,monospace">ULPS</text>
<rect x="853" y="472" width="89" height="30" rx="4" ry="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="897" y="491" font-size="12" fill="#7c3aed" text-anchor="middle" font-family="Consolas,monospace">Trigger</text>
<path d="M897,508 L897,560 L408,560 L408,482" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-purple)"/>
<text x="600" y="552" font-size="12" fill="#7c3aed" text-anchor="start">LP-11 立即退出 Escape</text>
<circle cx="285" cy="438" r="20" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
<text x="285" y="442" font-size="12" fill="#047857" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">10</text>
<text x="285" y="478" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">LP-10</text>
<text x="285" y="494" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">TLPX</text>
<circle cx="225" cy="438" r="20" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
<text x="225" y="442" font-size="12" fill="#047857" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">00</text>
<text x="225" y="478" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">LP-00</text>
<text x="225" y="494" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">TLPX</text>
<circle cx="165" cy="438" r="20" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
<text x="165" y="442" font-size="12" fill="#047857" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">10</text>
<text x="165" y="478" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">LP-10</text>
<text x="165" y="494" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">TLPX</text>
<circle cx="105" cy="438" r="20" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
<text x="105" y="442" font-size="12" fill="#047857" text-anchor="middle" font-weight="bold" font-family="Consolas,monospace">00</text>
<text x="105" y="478" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">LP-00</text>
<text x="105" y="494" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas,monospace">TTA-GO</text>
<path d="M325,438 L309,438" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
<path d="M265,438 L249,438" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
<path d="M205,438 L189,438" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
<path d="M145,438 L129,438" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
<path d="M85,438 L55,438 L55,530 L44,530" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
<rect x="40" y="500" width="220" height="64" rx="8" ry="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
<text x="150" y="525" font-size="12" fill="#047857" text-anchor="middle">④ LP-00 保持 TTA-GO = 4·TLPX</text>
<text x="150" y="547" font-size="12" fill="#047857" text-anchor="middle">随后停止驱动 → 令牌移交对方</text>
<path d="M150,564 L150,596 L360,596 L360,482" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-green)"/>
<text x="170" y="588" font-size="12" fill="#047857" text-anchor="start">对方驱动 LP-10 → LP-11 完成接管</text>
<rect x="325" y="400" width="150" height="76" rx="10" ry="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="400" y="432" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">Stop（LP-11）</text>
<text x="400" y="456" font-size="12" fill="#6b7280" text-anchor="middle">所有请求的起点 / 终点</text>
<circle cx="355" cy="360" r="6" fill="#111827"/>
<path d="M355,366 L355,394" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a-dark)"/>
<text x="345" y="364" font-size="12" fill="#6b7280" text-anchor="end">上电（TINIT ≥ 100µs）</text>
<rect x="430" y="578" width="500" height="62" rx="8" ry="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
<text x="446" y="600" font-size="12" fill="#c2410c" text-anchor="start">中止规则：任一请求序列在最终 Bridge 前检测到 LP-11 → 中止并等待 Stop</text>
<text x="446" y="622" font-size="12" fill="#c2410c" text-anchor="start">任意状态出现 Stop 达最小时间 → 状态机无条件回到 Stop（LP-11）</text>
<line x1="40" y1="664" x2="70" y2="664" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
<text x="78" y="668" font-size="12" fill="#6b7280" text-anchor="start">HS 请求序列</text>
<line x1="190" y1="664" x2="220" y2="664" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
<text x="228" y="668" font-size="12" fill="#6b7280" text-anchor="start">Escape 请求序列</text>
<line x1="360" y1="664" x2="390" y2="664" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
<text x="398" y="668" font-size="12" fill="#6b7280" text-anchor="start">Turnaround 序列</text>
<line x1="540" y1="664" x2="570" y2="664" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-gray)"/>
<text x="578" y="668" font-size="12" fill="#6b7280" text-anchor="start">返回 Stop（强制）</text>
</svg>