<text x="60" y="450" font-size="12" fill="#6b7280" text-anchor="start">DDR 时钟：1 个时钟周期 = 2 UI，上升沿位于数据比特中心（正交），双沿采样；TX 保证 burst 第一个 payload bit 期间出现时钟上升沿。</text>
<rect x="40" y="468" width="1120" height="86" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="56" y="490" font-size="12" fill="#374151" text-anchor="start">RX 侧：检测到 LP-00 后经 TD-TERM-EN（Dn 达 VTERM-EN，≤ 35ns+4UI）使能端接；在 THS-SETTLE（85ns+6UI ~ 145ns+10UI）窗口内忽略过渡，</text>
<text x="56" y="512" font-size="12" fill="#374151" text-anchor="start">搜索并锁定 Leader 序列 011101（容忍任意单比特错误）；EoT 时以 THS-SKIP（40ns ~ 55ns+4UI）回溯忽略末段过渡比特，确定最后有效字节。</text>
<text x="56" y="534" font-size="12" fill="#374151" text-anchor="start">组合约束：THS-PREPARE+THS-ZERO ≥ 145ns+10UI；TEOT ≤ 105ns+n·12UI（n=1 正向 / n=4 反向）；TCLK-MISS ≤ 60ns 检测时钟消失。</text>
<rect x="60" y="590" width="26" height="14" fill="url(#xhatch)" stroke="#2563eb" stroke-width="1"/>
