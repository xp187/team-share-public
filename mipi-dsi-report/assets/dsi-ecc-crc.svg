<line x1="332" y1="628" x2="482" y2="656" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<rect x="60" y="656" width="156" height="52" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="138" y="676" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">S = 0</text>
<text x="138" y="696" font-size="12" fill="#111827" text-anchor="middle">无错</text>
<rect x="232" y="656" width="156" height="52" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="310" y="676" font-size="12" fill="#111827" text-anchor="middle">S 命中矩阵或单位阵</text>
