<rect width="1200" height="720" fill="#ffffff"/>
<text x="600" y="36" font-size="18" fill="#111827" text-anchor="middle" font-weight="600">ECC 与 CRC-16：包级保护机制</text>
<text x="600" y="58" font-size="13" fill="#6b7280" text-anchor="middle">ECC 保护 32-bit Packet Header（纠 1 检 2）· CRC-16 保护 Payload（只检不纠）</text>
<line x1="600" y1="76" x2="600" y2="704" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
<text x="60" y="84" font-size="14" fill="#111827" text-anchor="start" font-weight="600">① ECC：Hamming 修改码 (30,24)，保护 24-bit PH</text>
<rect x="60" y="100" width="500" height="42" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="310" y="126" font-size="13" fill="#111827" text-anchor="middle">输入：24-bit header = DI（8 bit）+ WC（16 bit）</text>
<line x1="310" y1="144" x2="310" y2="156" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="60" y="158" width="500" height="42" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="310" y="184" font-size="13" fill="#111827" text-anchor="middle">按 6 条 XOR 方程生成 P5 ~ P0（见下方方程框）</text>
<line x1="310" y1="202" x2="310" y2="214" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="60" y="214" width="500" height="42" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="310" y="240" font-size="13" fill="#111827" text-anchor="middle">输出：ECC[7:0] = {0, 0, P5, P4, P3, P2, P1, P0}</text>
<rect x="60" y="268" width="500" height="132" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="75" y="290" font-size="12" fill="#111827" text-anchor="start" font-weight="600">P0 ~ P5 生成方程（D0 = header 第 0 bit，即 DI 的 LSB）</text>
<text x="75" y="308" font-size="12" fill="#111827" text-anchor="start" class="mono">P5 = D10^D11^D12^D13^D14^D15^D16^D17^D18^D19^D21^D22^D23</text>
<text x="75" y="325" font-size="12" fill="#111827" text-anchor="start" class="mono">P4 = D4^D5^D6^D7^D8^D9^D16^D17^D18^D19^D20^D22^D23</text>
<text x="75" y="342" font-size="12" fill="#111827" text-anchor="start" class="mono">P3 = D1^D2^D3^D7^D8^D9^D13^D14^D15^D19^D20^D21^D23</text>
<text x="75" y="359" font-size="12" fill="#111827" text-anchor="start" class="mono">P2 = D0^D2^D3^D5^D6^D9^D11^D12^D15^D18^D20^D21^D22</text>
<text x="75" y="376" font-size="12" fill="#111827" text-anchor="start" class="mono">P1 = D0^D1^D3^D4^D6^D8^D10^D12^D14^D17^D20^D21^D22^D23</text>
<text x="75" y="393" font-size="12" fill="#111827" text-anchor="start" class="mono">P0 = D0^D1^D2^D4^D5^D7^D10^D11^D13^D16^D20^D21^D22^D23</text>
<rect x="60" y="412" width="500" height="44" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="310" y="438" font-size="12" fill="#111827" text-anchor="middle" class="mono">示例：DI=0x37 + WC=0x01F0 → ECC=0x3F</text>
<rect x="60" y="468" width="500" height="42" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="310" y="494" font-size="13" fill="#111827" text-anchor="middle">接收端：用收到的 24-bit header 重算 ECC</text>
<line x1="310" y1="512" x2="310" y2="524" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="60" y="524" width="500" height="42" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="310" y="550" font-size="13" fill="#111827" text-anchor="middle">Syndrome S = 收到的 ECC ⊕ 重算的 ECC</text>
