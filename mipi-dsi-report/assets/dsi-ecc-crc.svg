<text x="640" y="84" font-size="14" fill="#111827" text-anchor="start" font-weight="600">② Checksum：CRC-16（保护 Payload，仅检错）</text>
<text x="640" y="108" font-size="12" fill="#111827" text-anchor="start" class="mono">多项式：x^16 + x^12 + x^5 + x^0（0x1021，反射 0x8408）</text>
<text x="640" y="130" font-size="12" fill="#111827" text-anchor="start">初值 0xFFFF · 输入 LSB first 逐比特 · 结果低字节先发</text>
