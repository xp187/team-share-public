<text x="600" y="36" font-size="18" fill="#111827" text-anchor="middle" font-weight="600">Video Mode 三种传输模式对比</text>
<text x="600" y="58" font-size="13" fill="#6b7280" text-anchor="middle">host 必须支持全部三种；Video Mode peripheral 至少支持一种（像素流只能用 HS 发送）</text>
<text x="60" y="108" font-size="14" fill="#111827" text-anchor="start" font-weight="600">(a) Non-Burst Sync Pulses</text>
<text x="60" y="128" font-size="12" fill="#6b7280" text-anchor="start">同步脉冲模式</text>
<text x="60" y="166" font-size="12" fill="#111827" text-anchor="start">· 每个 sync 发 Start + End 一对短包</text>
<text x="60" y="184" font-size="12" fill="#111827" text-anchor="start">· 像素按 DPI 速率发送（精确时序）</text>
<text x="60" y="202" font-size="12" fill="#111827" text-anchor="start">· Blanking 用 0x19 填充（或定时 LP-11 省电）</text>
<text x="60" y="220" font-size="12" fill="#111827" text-anchor="start" font-weight="600">· 外设无需 line buffer</text>
