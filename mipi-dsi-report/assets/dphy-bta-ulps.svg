<text x="800" y="648" font-size="12" fill="#374151" text-anchor="middle" font-family="Consolas,monospace">TWAKEUP = 1ms</text>
<rect x="60" y="662" width="1080" height="44" rx="8" ry="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="74" y="680" font-size="12" fill="#374151" text-anchor="start">Clock Lane ULPS：进入 LP-11 → LP-10（TX-ULPS-Rqst，TLPX）→ LP-00（TX-ULPS）；退出 = Mark-1（LP-10，TX-ULPS-Exit）持续 TWAKEUP = 1ms → LP-11。</text>
<text x="74" y="698" font-size="12" fill="#374151" text-anchor="start">Clock Lane 无常规 Escape mode，仅支持 ULPS；不识别的 Escape 命令被忽略并等待 Stop；ULPS 期间线保持 Space（LP-00）。</text>
