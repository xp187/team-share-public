<path d="M 742,219 C 742,346 112,346 112,219" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar-red)"/>
<rect x="377.0" y="327" width="106" height="22" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="430" y="342" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11px" font-weight="600" fill="#dc2626" text-anchor="middle">NACK (sda=1)</text>
<rect x="40" y="374" width="270" height="60" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="54" y="397" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12px" font-weight="700" fill="#16a34a" text-anchor="start">ACK 分支</text>
<text x="54" y="418" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11px" font-weight="400" fill="#6b7280" text-anchor="start">主机继续接收：data_ack → data</text>
<rect x="330" y="374" width="270" height="60" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
<text x="344" y="397" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12px" font-weight="700" fill="#dc2626" text-anchor="start">NACK 分支</text>
<text x="344" y="418" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11px" font-weight="400" fill="#6b7280" text-anchor="start">主机结束读取：data_ack → idle</text>
<rect x="620" y="374" width="300" height="60" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
<text x="634" y="397" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12px" font-weight="700" fill="#ea580c" text-anchor="start">协议要点</text>
<text x="634" y="418" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11px" font-weight="400" fill="#6b7280" text-anchor="start">SDA 在 ACK 位由接收方控制</text>
</svg>


