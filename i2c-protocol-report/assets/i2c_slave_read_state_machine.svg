<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450">
  <defs>
    <marker id="ar-blue" markerWidth="8" markerHeight="6" refX="7" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ar-green" markerWidth="8" markerHeight="6" refX="7" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="ar-red" markerWidth="8" markerHeight="6" refX="7" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="ar-mute" markerWidth="8" markerHeight="6" refX="7" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/></marker>
  </defs>
<rect width="960" height="450" fill="#ffffff"/>
<text x="40" y="40" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20px" font-weight="700" fill="#111827" text-anchor="start">I2C Slave 读操作状态机</text>
<text x="40" y="63" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12px" font-weight="400" fill="#6b7280" text-anchor="start">读方向进入数据发送阶段后，主机在每个字节末尾用 ACK/NACK 控制事务走向</text>
<line x1="40" y1="78" x2="920" y2="78" stroke="#d1d5db"/>
<line x1="165.0" y1="188" x2="255.0" y2="188" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-blue)"/>
<line x1="389.0" y1="188" x2="469.0" y2="188" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-blue)"/>
<line x1="595.0" y1="188" x2="669.0" y2="188" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-blue)"/>
<line x1="54" y1="188" x2="59.0" y2="188" stroke="#111827" stroke-width="1.8" marker-end="url(#ar-mute)"/>
<circle cx="48" cy="188" r="6" fill="#111827"/>
<rect x="66.0" y="157.0" width="92" height="62" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="112" y="184" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14px" font-weight="700" fill="#2563eb" text-anchor="middle">idle</text>
<text x="112" y="206" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11px" font-weight="400" fill="#6b7280" text-anchor="middle">等待 START</text>
<rect x="262.0" y="157.0" width="120" height="62" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="322" y="184" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14px" font-weight="700" fill="#2563eb" text-anchor="middle">slave_ack</text>
<text x="322" y="206" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11px" font-weight="400" fill="#6b7280" text-anchor="middle">地址 ACK</text>
<rect x="476.0" y="157.0" width="112" height="62" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="532" y="184" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14px" font-weight="700" fill="#2563eb" text-anchor="middle">data</text>
<text x="532" y="206" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11px" font-weight="400" fill="#6b7280" text-anchor="middle">发送读数据</text>
<rect x="676.0" y="157.0" width="132" height="62" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="742" y="184" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14px" font-weight="700" fill="#2563eb" text-anchor="middle">data_ack</text>
<text x="742" y="206" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11px" font-weight="400" fill="#6b7280" text-anchor="middle">采样主机响应</text>
<rect x="180.0" y="128" width="74" height="22" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="217" y="143" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11px" font-weight="600" fill="#2563eb" text-anchor="middle">地址匹配</text>
<rect x="395.0" y="128" width="64" height="22" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
