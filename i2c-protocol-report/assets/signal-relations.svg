<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
  <defs>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ar-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="ar-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="ar-mute" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
<text x="40" y="42" fill="#111827" font-size="17" font-weight="600" text-anchor="start">i2c_model 信号作用与联系</text>
<text x="40" y="64" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start">实线=驱动/赋值关系，虚线=观测或未被消费；端口加粗（基于 i2c_model.sv 源码逐行核对）</text>
<line x1="40" y1="76" x2="920" y2="76" stroke="#d1d5db" stroke-width="1"/>
<rect x="50" y="96" width="80" height="44" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="90" y="123" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">clk</text>
<rect x="180" y="88" width="190" height="60" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="275" y="112" fill="#111827" font-size="12" font-weight="600" text-anchor="middle">clk_cnt[6:0] 计数</text>
<text x="275" y="130" fill="#6b7280" font-size="9" font-weight="400" text-anchor="middle">0x22 → sclk↓（0x45 升沿为死分支）</text>
<line x1="130" y1="118" x2="176" y2="118" stroke="#111827" stroke-width="1.5" marker-end="url(#ar-blue)"/>
<rect x="430" y="76" width="110" height="40" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="485" y="101" fill="#111827" font-size="11" font-weight="600" text-anchor="middle">sclk（内部钟）</text>
<rect x="430" y="128" width="110" height="40" rx="8" ry="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="485" y="153" fill="#6b7280" font-size="11" font-weight="600" text-anchor="middle">scl_sync（静态）</text>
<line x1="370" y1="108" x2="426" y2="96" stroke="#111827" stroke-width="1.5" marker-end="url(#ar-blue)"/>
<rect x="590" y="96" width="130" height="56" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="655" y="118" fill="#111827" font-size="11" font-weight="600" text-anchor="middle">assign scli =</text>
<text x="655" y="134" fill="#111827" font-size="11" font-weight="600" text-anchor="middle">M ? sclk : scl_sync</text>
<line x1="540" y1="96" x2="586" y2="110" stroke="#111827" stroke-width="1.5" marker-end="url(#ar-blue)"/>
<line x1="540" y1="148" x2="586" y2="138" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar-mute)"/>
<rect x="590" y="180" width="130" height="40" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="655" y="204" fill="#111827" font-size="11" font-weight="600" text-anchor="middle">M（master 标志）</text>
<line x1="655" y1="180" x2="655" y2="156" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar-blue)"/>
<text x="700" y="170" fill="#6b7280" font-size="9" font-weight="400" text-anchor="start">start 置 1 / stop 清 0</text>
<rect x="780" y="92" width="130" height="56" rx="8" ry="8" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
<text x="845" y="116" fill="#111827" font-size="12" font-weight="600" text-anchor="middle">sclo（端口）</text>
<text x="845" y="134" fill="#6b7280" font-size="9" font-weight="400" text-anchor="middle">tri1 · assign #10</text>
<line x1="720" y1="124" x2="776" y2="122" stroke="#111827" stroke-width="2" marker-end="url(#ar-blue)"/>
<text x="748" y="112" fill="#6b7280" font-size="10" font-weight="400" text-anchor="middle">scli</text>
<rect x="430" y="236" width="290" height="56" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="575" y="256" fill="#9a3412" font-size="9" font-weight="600" text-anchor="middle">wait_start 逻辑（always @(posedge scli or posedge sclo)）</text>
<text x="575" y="274" fill="#111827" font-size="9" font-weight="400" text-anchor="middle">沿后 #10 检测到 sclo 低 → wait_start=1 → 异步复位 sclk=1, clk_cnt=0</text>
<path d="M 845,148 C 845,300 760,264 724,262" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar-mute)"/>
<line x1="430" y1="250" x2="370" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar-mute)"/>
<text x="352" y="210" fill="#6b7280" font-size="9" font-weight="400" text-anchor="middle">复位 sclk/clk_cnt</text>
<line x1="90" y1="140" x2="90" y2="330" stroke="#111827" stroke-width="1.5" marker-end="url(#ar-blue)"/>
<text x="96" y="240" fill="#6b7280" font-size="9" font-weight="400" text-anchor="start">posedge clk</text>
<rect x="50" y="352" width="150" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="125" y="374" fill="#111827" font-size="11" font-weight="600" text-anchor="middle">task 内驱动</text>
<text x="125" y="392" fill="#6b7280" font-size="9" font-weight="400" text-anchor="middle">0=拉低 / 1=释放</text>
<rect x="240" y="352" width="120" height="56" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="300" y="386" fill="#111827" font-size="12" font-weight="600" text-anchor="middle">sdai（reg）</text>
<line x1="200" y1="380" x2="236" y2="380" stroke="#111827" stroke-width="1.5" marker-end="url(#ar-blue)"/>
<rect x="240" y="428" width="120" height="50" rx="8" ry="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="300" y="448" fill="#6b7280" font-size="10" font-weight="600" text-anchor="middle">force_PIN_sda</text>
<text x="300" y="464" fill="#dc2626" font-size="8" font-weight="400" text-anchor="middle">窗口标记·本文件无消费者</text>
<rect x="420" y="352" width="150" height="56" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="495" y="374" fill="#111827" font-size="10" font-weight="600" text-anchor="middle">assign #5 sdao =</text>
<text x="495" y="390" fill="#111827" font-size="10" font-weight="600" text-anchor="middle">sdai ? 1'bz : sdai</text>
<line x1="360" y1="380" x2="416" y2="380" stroke="#111827" stroke-width="1.5" marker-end="url(#ar-blue)"/>
<rect x="640" y="348" width="130" height="64" rx="8" ry="8" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
<text x="705" y="374" fill="#111827" font-size="12" font-weight="600" text-anchor="middle">sdao（端口）</text>
<text x="705" y="392" fill="#6b7280" font-size="9" font-weight="400" text-anchor="middle">tri1 · 双向</text>
<line x1="570" y1="380" x2="636" y2="380" stroke="#111827" stroke-width="2" marker-end="url(#ar-blue)"/>
<rect x="420" y="452" width="130" height="46" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="485" y="472" fill="#111827" font-size="10" font-weight="600" text-anchor="middle">sda_d &lt;= sdao</text>
<text x="485" y="488" fill="#6b7280" font-size="9" font-weight="400" text-anchor="middle">@(posedge clk)</text>
<path d="M 705,412 C 705,470 600,475 554,475" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar-mute)"/>
<rect x="600" y="446" width="210" height="58" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="705" y="466" fill="#111827" font-size="10" font-weight="600" text-anchor="middle">SCL 高时判 {sdao,sda_d}</text>
<text x="705" y="482" fill="#6b7280" font-size="9" font-weight="400" text-anchor="middle">01→start_signal · 10→stop_signal</text>
<line x1="550" y1="475" x2="596" y2="475" stroke="#111827" stroke-width="1.5" marker-end="url(#ar-blue)"/>
<path d="M 770,412 C 790,430 760,442 754,444" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="830" y="446" width="110" height="58" rx="8" ry="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="885" y="466" fill="#6b7280" font-size="9" font-weight="600" text-anchor="middle">start/stop_signal</text>
<text x="885" y="482" fill="#dc2626" font-size="8" font-weight="400" text-anchor="middle">未被 task 消费</text>
<line x1="810" y1="475" x2="826" y2="475" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar-mute)"/>
<rect x="240" y="528" width="330" height="56" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="405" y="548" fill="#111827" font-size="10" font-weight="600" text-anchor="middle">master_rd：@(posedge sclo) 采样 sdao → data_rd</text>
<text x="405" y="566" fill="#6b7280" font-size="9" font-weight="400" text-anchor="middle">→ mhost_rx_data；ack=1 时第 9 拍拉低 sdai 回 ACK</text>
<path d="M 705,412 C 700,500 620,520 574,540" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar-mute)"/>
<rect x="600" y="528" width="340" height="88" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="616" y="548" fill="#1e40af" font-size="11" font-weight="600" text-anchor="start">状态输出</text>
<text x="616" y="566" fill="#111827" font-size="9" font-weight="400" text-anchor="start">master_ok：地址应答（1=失配，命名与含义相反）</text>
<text x="616" y="582" fill="#111827" font-size="9" font-weight="400" text-anchor="start">master_ack：写应答（1=NACK）；判据是内部 sdai 而非总线 sdao</text>
<text x="616" y="598" fill="#dc2626" font-size="9" font-weight="400" text-anchor="start">ddc_32mode：声明为 output，全文件无驱动</text>
</svg>
