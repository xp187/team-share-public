<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
  <defs>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ar-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="ar-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="ar-mute" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
<text x="40" y="42" fill="#111827" font-size="17" font-weight="600" text-anchor="start">START / STOP 条件与数据有效窗口</text>
<text x="40" y="64" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start">S 与 P 只在 SCL 高电平期间由 SDA 跳变产生；数据位期间 SCL 高时 SDA 必须保持稳定</text>
<line x1="40" y1="76" x2="920" y2="76" stroke="#d1d5db" stroke-width="1"/>
<text x="48" y="136" fill="#111827" font-size="13" font-weight="600" text-anchor="start">SCL</text>
<text x="48" y="236" fill="#111827" font-size="13" font-weight="600" text-anchor="start">SDA</text>
<rect x="306" y="196" width="108" height="68" rx="4" ry="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="426" y="196" width="68" height="68" rx="4" ry="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M 100,110 L 210,110 L 210,150 L 300,150 L 300,110 L 420,110 L 420,150 L 500,150 L 500,110 L 640,110 L 640,150 L 720,150 L 720,110 L 900,110" fill="none" stroke="#111827" stroke-width="2"/>
<path d="M 100,210 L 170,210 L 170,250 L 240,250 L 260,210 L 440,210 L 460,250 L 760,250 L 760,210 L 900,210" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<rect x="150" y="168" width="44" height="22" rx="4" ry="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="172" y="184" fill="#dc2626" font-size="12" font-weight="600" text-anchor="middle">S</text>
<rect x="738" y="168" width="44" height="22" rx="4" ry="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="760" y="184" fill="#16a34a" font-size="12" font-weight="600" text-anchor="middle">P</text>
<text x="150" y="286" fill="#dc2626" font-size="12" font-weight="400" text-anchor="start">START：SCL=1 时 SDA 高→低</text>
<text x="700" y="286" fill="#16a34a" font-size="12" font-weight="400" text-anchor="start">STOP：SCL=1 时 SDA 低→高</text>
<text x="360" y="232" fill="#16a34a" font-size="10" font-weight="400" text-anchor="middle">SCL=1：SDA 稳定</text>
<text x="460" y="226" fill="#2563eb" font-size="10" font-weight="400" text-anchor="middle">SCL=0</text>
<text x="460" y="242" fill="#2563eb" font-size="10" font-weight="400" text-anchor="middle">允许变化</text>
</svg>
