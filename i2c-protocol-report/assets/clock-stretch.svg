<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
  <defs>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ar-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="ar-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="ar-mute" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
<text x="40" y="42" fill="#111827" font-size="17" font-weight="600" text-anchor="start">时钟拉伸（Clock Stretching）</text>
<text x="40" y="64" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start">slave 在任意 SCL 低电平后继续拉低 SCL，强制 master 等待；常见于 ACK 之后</text>
<line x1="40" y1="76" x2="920" y2="76" stroke="#d1d5db" stroke-width="1"/>
<text x="48" y="136" fill="#111827" font-size="13" font-weight="600" text-anchor="start">SCL</text>
<text x="48" y="236" fill="#111827" font-size="13" font-weight="600" text-anchor="start">SDA</text>
<path d="M 100,150 L 112,150 L 112,110 L 168,110 L 168,150 L 200,150 L 212,110 L 268,110 L 268,150 L 640,150 L 652,110 L 708,110 L 708,150 L 740,150 L 752,110 L 808,110 L 808,150 L 880,150" fill="none" stroke="#111827" stroke-width="2"/>
<rect x="268" y="92" width="384" height="176" rx="4" ry="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="5,3"/>
<text x="460" y="108" fill="#dc2626" font-size="12" font-weight="600" text-anchor="middle">slave 保持拉低 SCL（时钟拉伸）</text>
<path d="M 100,210 L 150,210 L 160,250 L 230,250 L 240,210 L 660,210 L 670,250 L 740,250 L 750,210 L 880,210" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="460" y="236" fill="#6b7280" font-size="11" font-weight="400" text-anchor="middle">传输暂停，SDA 保持</text>
<path d="M 290,150 L 300,110 L 350,110 L 360,150" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="326" y="92" fill="#6b7280" font-size="11" font-weight="400" text-anchor="middle">master 本想继续打钟（虚线），检测到 SCL 未释放则等待</text>
<text x="100" y="296" fill="#111827" font-size="11" font-weight="400" text-anchor="start">DV：master 必须有等待/超时逻辑（DW_apb_i2c 有 tx/rx 超时）；case 覆盖 ACK 后拉伸、地址后拉伸</text>
</svg>
