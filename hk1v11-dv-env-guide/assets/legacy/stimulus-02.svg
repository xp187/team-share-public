          <text x="780" y="240" text-anchor="middle" font-size="9" fill="#66727d">--mode duplicate/average/delta/auto → DPLC_frameN_idM.ppm</text>
          <rect x="648" y="260" width="264" height="72" rx="8" fill="#e0f3eb" stroke="#16805f"/>
          <text x="780" y="278" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b232b">golden 输出（仿真目录）</text>
          <text x="780" y="293" text-anchor="middle" font-size="9" fill="#66727d">outResult/data_merge/*.txt</text>
          <text x="780" y="306" text-anchor="middle" font-size="9" fill="#66727d">outResult/digital/*_{Lodd,Leven,Rodd,Reven}.txt</text>
          <text x="780" y="319" text-anchor="middle" font-size="9" fill="#66727d">outResult/analog/*.txt</text>

          <rect x="630" y="356" width="300" height="96" rx="10" fill="#fff0d8" stroke="#a85d00"/>
          <text x="648" y="376" font-size="11" font-weight="700" fill="#1b232b">420b 分支（编译宏 CHPI_MODE_420B）</text>
          <text x="648" y="393" font-size="9.5" fill="#66727d">send_420b_lsp / ctrl_f_data / active_line（:1120-1449）</text>
          <text x="648" y="407" font-size="9.5" fill="#66727d">长编码 70b 对齐；IDLE 用 K5~K8 图案</text>
          <text x="648" y="421" font-size="9.5" font-weight="700" fill="#1b232b">注意：420b 路径不调 exec_c()</text>

          <rect x="630" y="462" width="300" height="114" rx="10" fill="#ffffff" stroke="#d9dee3"/>
          <text x="648" y="482" font-size="11" font-weight="700" fill="#1b232b">多帧与寄存器切换</text>
          <text x="648" y="499" font-size="9.5" fill="#66727d">帧数 env_cfg.frame_num（send_ppm :566）</text>
          <text x="648" y="513" font-size="9.5" fill="#66727d">末行提前发下一帧 CTRL_F（:816，对齐 K4 帧界）</text>
          <text x="648" y="527" font-size="9.5" fill="#66727d">process_line 每次都重读 cfg_frameN.txt（env_cfg:624）</text>
          <text x="648" y="541" font-size="9.5" fill="#66727d">golden 帧号约定 = RTL 帧号 + `DV（frame0 跳过比对）</text>

          <rect x="10" y="592" width="920" height="96" rx="12" fill="none" stroke="#d9dee3" stroke-width="1.5"/>
          <text x="28" y="614" font-size="12.5" font-weight="700" fill="#66727d">Transaction / Driver（isptx_agent）</text>
