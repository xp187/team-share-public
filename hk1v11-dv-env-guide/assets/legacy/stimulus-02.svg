          <text x="135" y="73" text-anchor="middle" font-size="9.5" fill="#66727d">env_cfg + 4×*_check_on</text>
          <rect x="250" y="44" width="210" height="36" rx="8" fill="#ffffff" stroke="#d9dee3"/>
          <text x="355" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#1b232b">user_def.sv</text>
          <text x="355" y="73" text-anchor="middle" font-size="9.5" fill="#66727d">HACT・VACT・FPS・PORT_NUM・FRAME_NUM</text>
          <rect x="470" y="44" width="210" height="36" rx="8" fill="#ffffff" stroke="#d9dee3"/>
          <text x="575" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#1b232b">pattern/frame_N.ppm</text>
          <text x="575" y="73" text-anchor="middle" font-size="9.5" fill="#66727d">P3 文本图像</text>
          <rect x="690" y="44" width="220" height="36" rx="8" fill="#ffffff" stroke="#d9dee3"/>
          <text x="800" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#1b232b">cfg_frameN.txt</text>
          <text x="800" y="73" text-anchor="middle" font-size="9.5" fill="#66727d">每帧寄存器值（二进制字符串）</text>

          <rect x="10" y="106" width="600" height="470" rx="12" fill="none" stroke="#16805f" stroke-width="1.5" stroke-dasharray="6 4"/>
          <text x="28" y="130" font-size="12.5" font-weight="700" fill="#16805f">发送端 TX · isptx_sequence.sv（8B/10B 主流程）</text>

          <rect x="30" y="142" width="560" height="48" rx="8" fill="#ffffff" stroke="#d9dee3"/>
          <text x="45" y="162" font-size="11.5" font-weight="700" fill="#1b232b">body()（:1064）</text>
          <text x="45" y="179" font-size="10" fill="#66727d">randomize → config_db 取 env_cfg / vif → plusargs SIM_TEST_PATH / FILE_PATH</text>

          <rect x="30" y="202" width="560" height="88" rx="8" fill="#ffffff" stroke="#d9dee3"/>
          <text x="45" y="220" font-size="11.5" font-weight="700" fill="#1b232b">send_isp() FSM（:985）</text>
          <rect x="45" y="228" width="165" height="52" rx="8" fill="#dff3ee" stroke="#087e6b"/>
          <text x="127" y="245" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b232b">TRAIN_SEND</text>
          <text x="127" y="260" text-anchor="middle" font-size="9" fill="#66727d">link_training TBK 逐 bit</text>
          <text x="127" y="272" text-anchor="middle" font-size="9" fill="#66727d">→ PAD_LOCK 后再 4us；500us 超时</text>
          <rect x="222" y="228" width="200" height="52" rx="8" fill="#dff3ee" stroke="#087e6b"/>
          <text x="322" y="245" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b232b">TRAIN_ACTIVE</text>
          <text x="322" y="260" text-anchor="middle" font-size="9" fill="#66727d">LSP → CTRL_F → send_ppm()</text>
          <text x="322" y="272" text-anchor="middle" font-size="9" fill="#66727d">mon_unlock 失锁重训（&gt;3 次放弃）</text>
          <rect x="434" y="228" width="140" height="52" rx="8" fill="#ffffff" stroke="#d9dee3"/>
          <text x="504" y="250" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b232b">DRV_PPM_DONE</text>
          <text x="504" y="266" text-anchor="middle" font-size="9" fill="#66727d">#300ns 结束</text>
          <line x1="210" y1="254" x2="218" y2="254" stroke="#66727d" stroke-width="1.2" marker-end="url(#am20)"/>
          <line x1="422" y1="254" x2="430" y2="254" stroke="#66727d" stroke-width="1.2" marker-end="url(#am20)"/>

          <rect x="30" y="302" width="175" height="86" rx="8" fill="#ffffff" stroke="#d9dee3"/>
          <text x="117" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#1b232b">send_LSP_seq(10)（:240）</text>
          <text x="117" y="337" text-anchor="middle" font-size="9.5" fill="#66727d">K2 → ea~ed 训练字节 ×32 → K3</text>
          <text x="117" y="351" text-anchor="middle" font-size="9.5" fill="#66727d">×10 次；K 极性取 rsp.init_data</text>
          <text x="117" y="365" text-anchor="middle" font-size="9.5" fill="#66727d">（driver 回传线上电平）</text>
          <rect x="215" y="302" width="185" height="86" rx="8" fill="#ffffff" stroke="#d9dee3"/>
          <text x="307" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#1b232b">send_CTRLF_seq(0)（:290）</text>
          <text x="307" y="337" text-anchor="middle" font-size="9.5" fill="#66727d">K4 → 60 字节寄存器</text>
          <text x="307" y="351" text-anchor="middle" font-size="9.5" fill="#66727d">get_ctrlF_reg()（:319）</text>
          <text x="307" y="365" text-anchor="middle" font-size="9.5" fill="#66727d">逐字节 scramble → encode_8b10b</text>
          <rect x="410" y="302" width="180" height="86" rx="8" fill="#dff3ee" stroke="#087e6b"/>
          <text x="500" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#1b232b">寄存器数据来源</text>
          <text x="500" y="337" text-anchor="middle" font-size="9.5" fill="#66727d">env_cfg.get_ctrlF/L_reg()</text>
          <text x="500" y="351" text-anchor="middle" font-size="9.5" fill="#66727d">→ process_line 重读 cfg_frameN.txt</text>
          <text x="500" y="365" text-anchor="middle" font-size="9.5" fill="#66727d">CTRL_F 60B(0x00~0x3F) / CTRL_L 5B</text>

          <rect x="30" y="404" width="560" height="160" rx="10" fill="none" stroke="#087e6b" stroke-width="1.2" stroke-dasharray="4 3"/>
          <text x="45" y="424" font-size="11.5" font-weight="700" fill="#087e6b">send_ppm() 逐帧循环 c = 0 .. frame_num-1（:539-983）</text>
          <rect x="45" y="436" width="165" height="116" rx="8" fill="#ffffff" stroke="#d9dee3"/>
          <text x="127" y="453" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b232b">VBP / VFP 行（:572/:919）</text>
          <text x="127" y="469" text-anchor="middle" font-size="9" fill="#66727d">HBP 0 填充 →</text>
          <text x="127" y="482" text-anchor="middle" font-size="9" fill="#66727d">CTRLL(BKDU=1)（:671）</text>
          <text x="127" y="495" text-anchor="middle" font-size="9" fill="#66727d">→ VBK 字节 → K2 key</text>
          <text x="127" y="508" text-anchor="middle" font-size="9" fill="#66727d">→ HFP 0 填充</text>
          <text x="127" y="526" text-anchor="middle" font-size="9" fill="#66727d">VBK_TEST 时 vbk 逐行++</text>
          <rect x="225" y="436" width="165" height="116" rx="8" fill="#e0f3eb" stroke="#16805f"/>
          <text x="307" y="453" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b232b">帧间（:634-638）</text>
          <text x="307" y="469" text-anchor="middle" font-size="9" fill="#66727d">get_ppm() 按 lane id 截取（:453）</text>
          <text x="307" y="482" text-anchor="middle" font-size="9" fill="#66727d">→ write_ppm() 存档（:157）</text>
          <text x="307" y="495" text-anchor="middle" font-size="9" font-weight="700" fill="#1b232b">→ exec_c(c) 每帧 VACT 前一次</text>
          <text x="307" y="508" text-anchor="middle" font-size="9" fill="#66727d">pixels 无跨帧缓存</text>
          <text x="307" y="526" text-anchor="middle" font-size="9" fill="#66727d">帧末 delete</text>
          <rect x="405" y="436" width="170" height="116" rx="8" fill="#ffffff" stroke="#d9dee3"/>
          <text x="490" y="453" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b232b">VACT 行（:644-917）</text>
          <text x="490" y="469" text-anchor="middle" font-size="9" fill="#66727d">CTRLL（仅首行 Fsync=1）</text>
          <text x="490" y="482" text-anchor="middle" font-size="9" fill="#66727d">逐字节 scramble→8b10b→ONE_PKT</text>
          <text x="490" y="495" text-anchor="middle" font-size="9" fill="#66727d">行尾 K3（开扰）/ K2 → HFP 0</text>
          <text x="490" y="508" text-anchor="middle" font-size="9" fill="#66727d">末行 send_CTRLF_seq(c+1)（:816）</text>
          <text x="490" y="526" text-anchor="middle" font-size="9" font-weight="700" fill="#1b232b">← 帧间寄存器切换点</text>
