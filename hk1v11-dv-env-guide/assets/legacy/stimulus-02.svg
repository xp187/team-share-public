          <text x="195" y="657" text-anchor="middle" font-size="9" fill="#66727d">id 枚举 + one_pkt[9:0] + k1~k4；rsp.init_data 回传电平</text>
          <rect x="390" y="624" width="330" height="52" rx="8" fill="#ffffff" stroke="#d9dee3"/>
