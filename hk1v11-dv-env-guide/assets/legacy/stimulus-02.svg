          <text x="780" y="160" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b232b">pic_process（$system 调用）</text>
          <text x="780" y="175" text-anchor="middle" font-size="9" fill="#66727d">-W -H -P -I frame_c -R outResult -p 1</text>
          <text x="780" y="188" text-anchor="middle" font-size="9" fill="#66727d">-r CH_SEL -X HPOL1 -Y POL2 -O POL -C POLC -S SDC -OW -H4</text>
          <rect x="648" y="208" width="264" height="44" rx="8" fill="#ffffff" stroke="#d9dee3"/>
