<svg viewBox="0 0 920 240" width="920" role="img" aria-label="寄存器配置路径图">
          <defs>
            <marker id="am5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="#66727d"></path>
            </marker>
          </defs>
          <text x="20" y="26" font-size="12.5" font-weight="700" fill="#16805f">路径 A：链路写入（主力，所有图像用例）</text>
          <rect x="20" y="40" width="150" height="48" rx="10" fill="#dff3ee" stroke="#087e6b" stroke-width="1.5"/>
          <text x="95" y="60" text-anchor="middle" font-size="11.5" fill="#1b232b">cfg_frameN.txt</text>
          <text x="95" y="76" text-anchor="middle" font-size="10.5" fill="#66727d">每帧寄存器值</text>
          <rect x="205" y="40" width="185" height="48" rx="10" fill="#ffffff" stroke="#d9dee3" stroke-width="1.5"/>
          <text x="297" y="60" text-anchor="middle" font-size="11.5" fill="#1b232b">env_cfg.get_ctrlF/L_reg()</text>
          <text x="297" y="76" text-anchor="middle" font-size="10.5" fill="#66727d">autogen 段，脚本生成</text>
          <rect x="425" y="40" width="160" height="48" rx="10" fill="#ffffff" stroke="#d9dee3" stroke-width="1.5"/>
          <text x="505" y="60" text-anchor="middle" font-size="11.5" fill="#1b232b">CTRL_F / CTRL_L 包</text>
          <text x="505" y="76" text-anchor="middle" font-size="10.5" fill="#66727d">随 ISP 数据流</text>
          <rect x="620" y="40" width="130" height="48" rx="10" fill="#dff3ee" stroke="#087e6b" stroke-width="1.5"/>
          <text x="685" y="69" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b232b">DUT 寄存器</text>
          <line x1="170" y1="64" x2="201" y2="64" stroke="#66727d" stroke-width="1.5" marker-end="url(#am5)"/>
          <line x1="390" y1="64" x2="421" y2="64" stroke="#66727d" stroke-width="1.5" marker-end="url(#am5)"/>
          <line x1="585" y1="64" x2="616" y2="64" stroke="#66727d" stroke-width="1.5" marker-end="url(#am5)"/>

          <text x="20" y="122" font-size="12.5" font-weight="700" fill="#087e6b">路径 B：I2C（仅 t_reg_i2c_* 专项）</text>
          <rect x="20" y="136" width="150" height="48" rx="10" fill="#ffffff" stroke="#d9dee3" stroke-width="1.5"/>
          <text x="95" y="156" text-anchor="middle" font-size="11.5" fill="#1b232b">i2c_model BFM</text>
          <text x="95" y="172" text-anchor="middle" font-size="10.5" fill="#66727d">宏 `I2C 层次化调用</text>
          <rect x="205" y="136" width="185" height="48" rx="10" fill="#ffffff" stroke="#d9dee3" stroke-width="1.5"/>
          <text x="297" y="156" text-anchor="middle" font-size="11.5" fill="#1b232b">解锁 devid 7'h62</text>
          <text x="297" y="172" text-anchor="middle" font-size="10.5" fill="#66727d">0xF0=0x5A, 0xF1=0xA5</text>
          <rect x="425" y="136" width="160" height="48" rx="10" fill="#ffffff" stroke="#d9dee3" stroke-width="1.5"/>
          <text x="505" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b232b">读写 devid 7'h70</text>
          <text x="505" y="172" text-anchor="middle" font-size="10.5" fill="#66727d">TEST7/8 = SCL/SDA</text>

          <text x="20" y="212" font-size="12.5" font-weight="700" fill="#a85d00">路径 C：UVM reg_model（rm.read/write）</text>
          <rect x="620" y="136" width="240" height="48" rx="10" fill="#fff0d8" stroke="#a85d00" stroke-width="1.5"/>
          <text x="740" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b232b">uvm_reg → adapter → bcc_agt</text>
          <text x="740" y="172" text-anchor="middle" font-size="10.5" fill="#66727d">从 BCC 口发出</text>
          <line x1="170" y1="160" x2="201" y2="160" stroke="#66727d" stroke-width="1.5" marker-end="url(#am5)"/>
          <line x1="390" y1="160" x2="421" y2="160" stroke="#66727d" stroke-width="1.5" marker-end="url(#am5)"/>
        </svg>